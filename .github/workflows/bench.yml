name: Benchmark

on:
     pull_request:
          branches:
               - main

env:
     CARGO_TERM_COLOR: always

jobs:
     benchmark:
          name: compare benchmarks against the base branch
          runs-on: ubuntu-latest
          permissions:
               contents: read
               pull-requests: write
          env:
               BASE_REF: ${{ github.base_ref }}
               CARGO_TARGET_DIR: ${{ github.workspace }}/target
          steps:
               - uses: actions/checkout@v4
                 with:
                      fetch-depth: 0
               - uses: dtolnay/rust-toolchain@stable
               - uses: actions/cache@v4
                 with:
                      path: |
                           ~/.cargo/bin/
                           ~/.cargo/registry/index/
                           ~/.cargo/registry/cache/
                           ~/.cargo/git/db/
                      key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.toml') }}
               - name: Install critcmp
                 run: command -v critcmp || cargo install critcmp --locked
               - name: Benchmark base branch
                 run: |
                      git worktree add "$RUNNER_TEMP/base" "origin/$BASE_REF"
                      cd "$RUNNER_TEMP/base"
                      if [ ! -f benches/emitter.rs ]; then
                           cp -r "$GITHUB_WORKSPACE/benches" .
                           printf '\n[dev-dependencies.criterion]\nversion = "0.5.1"\nfeatures = [ "async_tokio" ]\n\n[[bench]]\nname = "emitter"\nharness = false\n' >> Cargo.toml
                           echo "BASE_USES_PR_BENCHES=true" >> "$GITHUB_ENV"
                      fi
                      cargo bench --bench emitter -- --save-baseline base \
                           || echo "::warning::benchmarks failed to build or run on $BASE_REF"
               - name: Benchmark pull request
                 run: cargo bench --bench emitter -- --save-baseline pr
               - name: Compare
                 run: |
                      {
                           echo "<!-- benchmark-comparison -->"
                           echo "### Benchmarks against \`$BASE_REF\`"
                           echo
                           if find target/criterion -type d -name base | grep -q .; then
                                if [ "$BASE_USES_PR_BENCHES" = true ]; then
                                     echo "\`$BASE_REF\` has no benchmarks, so it was measured with this PR's."
                                     echo
                                fi
                                node .github/scripts/benchmark-table.js target/criterion base pr "$BASE_REF" "this PR"
                                echo
                                echo "<details><summary>critcmp</summary>"
                                echo
                                echo '```'
                                critcmp base pr
                                echo '```'
                                echo
                                echo "</details>"
                           else
                                echo "Benchmarks could not run on \`$BASE_REF\`, so there is nothing to compare against."
                           fi
                      } > comment.md
                      echo "${{ github.event.pull_request.number }}" > pr-number
                      cat comment.md >> "$GITHUB_STEP_SUMMARY"
               - uses: actions/upload-artifact@v4
                 with:
                      name: benchmark-comparison
                      path: |
                           comment.md
                           pr-number
               - name: Comment on pull request
                 if: github.event.pull_request.head.repo.full_name == github.repository
                 uses: actions/github-script@v7
                 with:
                      script: |
                           const fs = require('fs');
                           const post = require('./.github/scripts/benchmark-comment.js');
                           await post({
                                github,
                                context,
                                issueNumber: context.issue.number,
                                body: fs.readFileSync('comment.md', 'utf8'),
                           });
